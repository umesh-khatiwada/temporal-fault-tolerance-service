apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: temporal
  labels:
    app.kubernetes.io/name: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:15-alpine
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_USER
          value: "temporal"
        - name: POSTGRES_PASSWORD
          value: "temporal"
        - name: POSTGRES_DB
          value: "temporal"
        resources:
          limits:
            memory: "512Mi"
            cpu: "500m"
          requests:
            memory: "128Mi"
            cpu: "100m"
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: temporal
spec:
  selector:
    app.kubernetes.io/name: postgres
  ports:
  - port: 5432
    targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal-server
  namespace: temporal
  labels:
    app.kubernetes.io/name: temporal-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: temporal-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: temporal-server
    spec:
      enableServiceLinks: false
      initContainers:
      - name: wait-for-postgres
        image: postgres:15-alpine
        command: ['sh', '-c', 'until pg_isready -h postgres -p 5432 -U temporal; do echo waiting for postgres; sleep 2; done']
      containers:
      - name: temporal-server
        image: temporalio/auto-setup:latest
        ports:
        - name: rpc
          containerPort: 7233
        - name: membership
          containerPort: 6933
        - name: metrics
          containerPort: 9090
        env:
        - name: DB
          value: "postgres12"
        - name: DB_PORT
          value: "5432"
        - name: POSTGRES_SEEDS
          value: "postgres"
        - name: POSTGRES_PORT
          value: "5432"
        - name: POSTGRES_USER
          value: "temporal"
        - name: POSTGRES_PWD
          value: "temporal"
        - name: BIND_ON_IP
          value: "0.0.0.0"
        resources:
          limits:
            memory: "1024Mi"
            cpu: "1000m"
          requests:
            memory: "256Mi"
            cpu: "250m"
---
apiVersion: v1
kind: Service
metadata:
  name: temporal-frontend
  namespace: temporal
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: temporal-server
  ports:
  - name: grpc
    port: 7233
    targetPort: 7233
    nodePort: 30733
