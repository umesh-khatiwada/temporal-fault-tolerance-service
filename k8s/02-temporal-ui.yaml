apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal-ui
  namespace: temporal
  labels:
    app.kubernetes.io/name: temporal-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: temporal-ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: temporal-ui
    spec:
      enableServiceLinks: false
      containers:
      - name: temporal-ui
        image: temporalio/ui:latest
        ports:
        - name: http
          containerPort: 8080
        env:
        - name: TEMPORAL_PORT
          value: "8080"
        - name: TEMPORAL_ADDRESS
          value: "temporal-frontend.temporal.svc.cluster.local:7233"
        - name: TEMPORAL_CORS_ORIGINS
          value: "http://localhost:8233"
        resources:
          limits:
            memory: "256Mi"
            cpu: "250m"
          requests:
            memory: "64Mi"
            cpu: "50m"
---
apiVersion: v1
kind: Service
metadata:
  name: temporal-ui
  namespace: temporal
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: temporal-ui
  ports:
  - name: http
    port: 8080
    targetPort: 8080
    nodePort: 30233
