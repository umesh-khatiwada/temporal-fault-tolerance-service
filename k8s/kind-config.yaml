kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: temporal-cluster
nodes:
- role: control-plane
  extraPortMappings:
  # Temporal Web UI
  - containerPort: 30233
    hostPort: 8233
    listenAddress: "0.0.0.0"
    protocol: TCP
  # Temporal Frontend gRPC
  - containerPort: 30733
    hostPort: 7233
    listenAddress: "0.0.0.0"
    protocol: TCP
